# Builds the data with the Python pipeline and deploys the static site to GitHub Pages.
#
# One-time setup (repository Settings):
#   1. Settings → Secrets and variables → Actions → New repository secret: FRED_API_KEY
#   2. Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Schedules are in UTC and follow the data, not a fixed "live" cadence:
#   13:20  after NY Fed reference rates (~08:00 ET) and the Daily Treasury Statement (~16:00 ET prior day)
#   21:50  after FRED/H.15 updates and the US cash close
#   23:40  after the Treasury par-curve publication (~18:00 ET) and the UTC crypto day close
#   05:20  Asia/Europe overnight data (BoJ/MoF, BIS, RSS) – daily incl. weekends (crypto)
#   Sunday 04:10 full refresh: refetches complete histories to pick up revisions + keep-alive commit
# GitHub may delay scheduled runs by several minutes at busy times.
name: Build data & deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "content/**", "pipeline/**", "requirements.txt", ".github/workflows/build-and-deploy.yml"]
  schedule:
    - cron: "20 13 * * 1-5"
    - cron: "50 21 * * 1-5"
    - cron: "40 23 * * 1-5"
    - cron: "20 5 * * *"
    - cron: "10 4 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental (fast) or full (refetch all history)"
        default: incremental
        type: choice
        options: [incremental, full]

permissions:
  contents: write   # weekly keep-alive commit of status/last-run.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests (pipeline)
        run: python -m pytest -q pipeline/tests

      - name: Unit tests (front-end calculations)
        run: node --test site/assets/js/tests/*.test.mjs

      - name: Choose mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event.schedule }}" = "10 4 * * 0" ]; then MODE=full; fi
          echo "mode=${MODE:-incremental}" >> "$GITHUB_OUTPUT"

      - name: Run data pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Previous build = last-known-good fallback and the base for incremental fetching.
          WICK_PREVIOUS_BASE: https://${{ github.repository_owner }}.github.io/data
        run: python -m pipeline.run --out site/data --mode "${{ steps.mode.outputs.mode }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Weekly keep-alive commit (prevents GitHub disabling schedules after 60 idle days)
        if: steps.mode.outputs.mode == 'full'
        run: |
          mkdir -p status
          python -c "import json;s=json.load(open('site/data/status.json'));json.dump({k:s[k] for k in ('started_at','finished_at','mode','counts')},open('status/last-run.json','w'),indent=2)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/last-run.json
          git commit -m "Weekly data-pipeline status [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
