# Builds the data with the Python pipeline and deploys the static site to GitHub Pages.
#
# One-time setup (repository Settings):
#   1. Settings → Secrets and variables → Actions → New repository secret: FRED_API_KEY
#   2. Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Schedules (UTC). GitHub may start scheduled runs late at busy times, so odd minutes are used.
#   every 15 min, Mon–Fri   quick run: asks FRED which series changed since the last build and
#                           downloads only those; every other source is refreshed in full.
#                           The site is redeployed only if the published data changed.
#   hourly, Sat–Sun         quick run (crypto, weekend releases)
#   23:40 daily             incremental run: re-checks every FRED series (safety net)
#   Sunday 04:10            full refresh: refetches complete histories to pick up revisions + keep-alive commit
name: Build data & deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "content/**", "pipeline/**", "requirements.txt", ".github/workflows/build-and-deploy.yml"]
  schedule:
    - cron: "7,22,37,52 * * * 1-5"
    - cron: "37 * * * 0,6"
    - cron: "40 23 * * *"
    - cron: "10 4 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "quick (only updated FRED series), incremental, or full (refetch all history)"
        default: quick
        type: choice
        options: [quick, incremental, full]

permissions:
  contents: write   # weekly keep-alive commit of status/last-run.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy: ${{ steps.pipeline.outputs.changed != 'false' || steps.mode.outputs.mode != 'quick' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests (pipeline)
        run: python -m pytest -q pipeline/tests

      - name: Unit tests (front-end calculations)
        run: node --test site/assets/js/tests/*.test.mjs

      - name: Choose mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          case "${{ github.event.schedule }}" in
            "10 4 * * 0") MODE=full ;;
            "40 23 * * *") MODE=incremental ;;
            "") ;;
            *) MODE=quick ;;
          esac
          echo "mode=${MODE:-incremental}" >> "$GITHUB_OUTPUT"

      - name: Run data pipeline
        id: pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Previous build = last-known-good fallback and the base for incremental fetching.
          WICK_PREVIOUS_BASE: https://${{ github.repository_owner }}.github.io/data
        run: python -m pipeline.run --out site/data --mode "${{ steps.mode.outputs.mode }}"

      - name: Publish run report to the pipeline-status branch
        # A tiny orphan branch holding status.json and a per-series health table, so run health can be
        # checked with git (or on github.com) without opening the Actions logs. Never touches main.
        if: always()
        run: |
          python - <<'PY'
          import json, os
          os.makedirs("_status", exist_ok=True)
          try:
              st = json.load(open("site/data/status.json"))
          except Exception as e:
              st = {"error": f"status.json missing: {e}"}
          json.dump(st, open("_status/status.json", "w"), indent=2)
          try:
              cat = json.load(open("site/data/catalog.json"))["series"]
              rows = ["| id | status | stale | first obs | latest obs | n | latest value | provider | note |", "|---|---|---|---|---|---|---|---|---|"]
              for k, m in sorted(cat.items(), key=lambda kv: (kv[1].get("status") == "ok", kv[0])):
                  L = m.get("latest") or {}
                  rows.append(f"| {k} | {m.get('status')} | {m.get('stale', '')} | {L.get('first_date', '')} | {L.get('date', '')} | {L.get('n', '')} | {L.get('value', '')} | {m.get('provider_key', '')} | {(m.get('note') or '')[:80]} |")
              open("_status/SERIES.md", "w").write("\n".join(rows) + "\n")
          except Exception as e:
              open("_status/SERIES.md", "w").write(f"catalog unavailable: {e}\n")
          PY
          cd _status
          git init -q -b pipeline-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Pipeline run ${{ github.run_id }} (${{ steps.mode.outputs.mode }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pipeline-status || echo "status push skipped"

      - name: Upload Pages artifact
        # an identical quick build is not redeployed
        if: steps.pipeline.outputs.changed != 'false' || steps.mode.outputs.mode != 'quick'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Weekly keep-alive commit (prevents GitHub disabling schedules after 60 idle days)
        if: steps.mode.outputs.mode == 'full'
        run: |
          mkdir -p status
          python -c "import json;s=json.load(open('site/data/status.json'));json.dump({k:s[k] for k in ('started_at','finished_at','mode','counts')},open('status/last-run.json','w'),indent=2)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/last-run.json
          git commit -m "Weekly data-pipeline status [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
