# Central-bank policy rates from BIS (stored as step series: one point per change + latest date).
policy_rates:
  provider: bis
  check: tested
  start: "1990-01-01"
  areas:
    US: {name: "Federal Reserve (target range midpoint)", bank: Fed}
    XM: {name: "ECB deposit facility rate", bank: ECB}
    GB: {name: "Bank of England Bank Rate", bank: BoE}
    JP: {name: "Bank of Japan policy rate", bank: BoJ}
    CA: {name: "Bank of Canada overnight target", bank: BoC}
    CH: {name: "Swiss National Bank policy rate", bank: SNB}
    AU: {name: "Reserve Bank of Australia cash rate", bank: RBA}

# Sovereign curves (matrix files: data/curves/<id>.json). Tenor columns are also exposed as
# virtual series "<ID>_<TENOR>" (e.g. US_10Y) in the catalogue.
curves:
  - {id: US, name: "US Treasury par curve", provider: treasury, check: tested, start_year: 2000, type: treasury_yield}
  - {id: DE, name: "German Bund curve (Svensson zero)", provider: bundesbank, check: tested, start: "2000-01-01", type: treasury_yield}
  - {id: UK, name: "UK gilt nominal par curve (BoE)", provider: boe, check: partial, start: "2000-01-01", type: treasury_yield}
  - {id: JP, name: "JGB curve (MoF)", provider: mof, check: partial, type: treasury_yield}
  - {id: CA, name: "Government of Canada benchmark yields", provider: boc, check: tested, start: "2001-01-01", type: treasury_yield}

# Derived series (computed in pipeline/derive.py from the series above; formulas shown in the UI).
derived:
  - {id: US2S10S, name: "UST 2s10s", op: spread, a: UST10Y, b: UST2Y, scale: 100, units: bp, change: abs, formula: "(10Y − 2Y) × 100"}
  - {id: US5S30S, name: "UST 5s30s", op: spread, a: UST30Y, b: UST5Y, scale: 100, units: bp, change: abs, formula: "(30Y − 5Y) × 100"}
  - {id: US3M10Y, name: "UST 3m10y", op: spread, a: UST10Y, b: UST3M, scale: 100, units: bp, change: abs, formula: "(10Y − 3M) × 100"}
  - {id: US2Y_EFFR, name: "UST 2Y − EFFR", op: spread, a: UST2Y, b: EFFR, scale: 100, units: bp, change: abs, formula: "(2Y yield − EFFR) × 100. Rough gauge of easing (<0) / tightening (>0) priced over 2 years; includes term premium."}
  - {id: SOFR_IORB, name: "SOFR − IORB", op: spread, a: SOFR, b: IORB, scale: 100, units: bp, change: abs, formula: "(SOFR − IORB) × 100"}
  - {id: SOFR99_IORB, name: "SOFR 99th pct − IORB", op: spread, a: SOFR_P99, b: IORB, scale: 100, units: bp, change: abs, formula: "(SOFR 99th percentile − IORB) × 100. Tail funding pressure."}
  - {id: EFFR_IORB, name: "EFFR − IORB", op: spread, a: EFFR, b: IORB, scale: 100, units: bp, change: abs, formula: "(EFFR − IORB) × 100"}
  - {id: TGCR_RRP, name: "TGCR − ON RRP rate", op: spread, a: TGCR, b: ONRRP_RATE, scale: 100, units: bp, change: abs, formula: "(TGCR − ON RRP award rate) × 100"}
  - {id: NET_LIQ, name: "Net liquidity proxy", op: net_liquidity, units: "USD bn", change: abs, formula: "Fed total assets (WALCL) − TGA (WTREGEN) − ON RRP (RRPONTSYD), Wednesday levels, USD bn. A widely used proxy, not an official measure."}
  - {id: UST10Y_RVOL, name: "UST 10Y realised vol (21d)", op: realised_vol_bp, a: UST10Y, window: 21, units: "bp/yr", change: abs, formula: "stdev(daily Δ10Y, 21 obs) × √252, in bp. Substitute for MOVE (not available)."}
  - {id: CPI_YOY, name: "CPI y/y", op: yoy, a: CPI, units: "%", change: abs, formula: "CPI_t / CPI_{t−12} − 1"}
  - {id: CORE_CPI_YOY, name: "Core CPI y/y", op: yoy, a: CORE_CPI, units: "%", change: abs, formula: "Core CPI_t / Core CPI_{t−12} − 1"}
  - {id: CORE_CPI_3M, name: "Core CPI 3m annualised", op: ann3m, a: CORE_CPI, units: "%", change: abs, formula: "(Core CPI_t / Core CPI_{t−3})^4 − 1"}
  - {id: CORE_CPI_MOM, name: "Core CPI m/m", op: mom, a: CORE_CPI, units: "%", change: abs, formula: "Core CPI_t / Core CPI_{t−1} − 1"}
  - {id: CPI_SERVICES_YOY, name: "CPI services y/y", op: yoy, a: CPI_SERVICES, units: "%", change: abs, formula: "y/y % change"}
  - {id: CPI_SHELTER_YOY, name: "CPI shelter y/y", op: yoy, a: CPI_SHELTER, units: "%", change: abs, formula: "y/y % change"}
  - {id: PCE_YOY, name: "PCE y/y", op: yoy, a: PCE, units: "%", change: abs, formula: "y/y % change"}
  - {id: CORE_PCE_YOY, name: "Core PCE y/y", op: yoy, a: CORE_PCE, units: "%", change: abs, formula: "y/y % change"}
  - {id: CORE_PCE_3M, name: "Core PCE 3m annualised", op: ann3m, a: CORE_PCE, units: "%", change: abs, formula: "(P_t / P_{t−3})^4 − 1"}
  - {id: PPI_YOY, name: "PPI final demand y/y", op: yoy, a: PPI, units: "%", change: abs, formula: "y/y % change"}
  - {id: EA_HICP_YOY, name: "Euro area HICP y/y", op: yoy, a: EA_HICP, units: "%", change: abs, formula: "y/y % change"}
  - {id: PAYROLLS_CHG, name: "Payrolls m/m change", op: diff, a: PAYROLLS, units: "thousands", change: abs, formula: "PAYEMS_t − PAYEMS_{t−1}"}
  - {id: PAYROLLS_3MAVG, name: "Payrolls 3m avg change", op: diff_avg3, a: PAYROLLS, units: "thousands", change: abs, formula: "mean of last 3 monthly changes"}
  - {id: AHE_YOY, name: "Average hourly earnings y/y", op: yoy, a: AHE, units: "%", change: abs, formula: "y/y % change"}
  - {id: INDPRO_YOY, name: "Industrial production y/y", op: yoy, a: INDPRO, units: "%", change: abs, formula: "y/y % change"}
  - {id: RETAIL_YOY, name: "Retail sales y/y", op: yoy, a: RETAIL, units: "%", change: abs, formula: "y/y % change"}
  - {id: REAL_GDP_QQ, name: "Real GDP q/q annualised", op: ann1q, a: REAL_GDP, units: "%", change: abs, formula: "(GDP_t / GDP_{t−1})^4 − 1"}
  - {id: CLAIMS_4WK, name: "Initial claims 4-week avg", op: avg4, a: CLAIMS, units: "thousands", change: abs, formula: "mean of last 4 weekly prints"}
  - {id: IT_DE_10Y_M, name: "Italy − Germany 10Y (monthly)", op: spread, a: IT10Y_M, b: DE10Y_M, scale: 100, units: bp, change: abs, formula: "(IT 10Y − DE 10Y) × 100"}
  - {id: FR_DE_10Y_M, name: "France − Germany 10Y (monthly)", op: spread, a: FR10Y_M, b: DE10Y_M, scale: 100, units: bp, change: abs, formula: "(FR 10Y − DE 10Y) × 100"}
  - {id: US_DE_10Y, name: "US − Germany 10Y", op: spread, a: US_10Y, b: DE_10Y, scale: 100, units: bp, change: abs, formula: "(UST 10Y par − Bund 10Y Svensson zero) × 100. Mixed curve conventions (par vs zero) – read changes, not level."}
  - {id: US_UK_10Y, name: "US − UK 10Y", op: spread, a: US_10Y, b: UK_10Y, scale: 100, units: bp, change: abs, formula: "(UST 10Y − gilt 10Y par) × 100"}
  - {id: US_JP_10Y, name: "US − Japan 10Y", op: spread, a: US_10Y, b: JP_10Y, scale: 100, units: bp, change: abs, formula: "(UST 10Y − JGB 10Y) × 100"}
  - {id: US_CA_10Y, name: "US − Canada 10Y", op: spread, a: US_10Y, b: CA_10Y, scale: 100, units: bp, change: abs, formula: "(UST 10Y − GoC 10Y) × 100"}
  - {id: DE2S10S, name: "Bund 2s10s", op: spread, a: DE_10Y, b: DE_2Y, scale: 100, units: bp, change: abs, formula: "(10Y − 2Y) × 100"}

# ------------------------------------------------------------------------------------------
# FRED library: the broad FRED watchlist, browsable in the terminal's "FRED library" module.
# Add a series by appending its FRED ID to a group – name, units and frequency are read from
# FRED's metadata automatically. Use a mapping ({key: ID, name: ..., units: ...}) to override.
# IDs already configured above are referenced, not fetched twice.
# check: tested = called successfully on 2026-10-10; production = returned data in the old pipeline;
#        family (default) = FRED API verified, this ID confirmed at first pipeline run.
# ------------------------------------------------------------------------------------------
fred_library:
  - group: "Fed funds & policy rates"
    type: administered
    series:
      - {key: DFF, name: "Effective fed funds rate (daily, since 1954)", type: overnight_market, start: "1954-07-01"}
      - {key: FEDFUNDS, name: "Effective fed funds rate (monthly avg)", type: overnight_market, start: "1954-07-01"}
      - {key: DFEDTAR, name: "Fed funds target (single target, to Dec 2008)", check: tested, start: "1982-09-27"}
      - DFEDTARU
      - DFEDTARL
      - IORB
      - {key: IOER, name: "Interest on excess reserves (to Jul 2021)", start: "2008-10-09"}
      - RRPONTSYAWARD
      - {key: DPCREDIT, name: "Discount window primary credit rate", check: tested, start: "2003-01-09"}
      - {key: DPRIME, name: "Bank prime loan rate", start: "1955-08-04"}
