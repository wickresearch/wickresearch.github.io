# Wick Research series catalogue
# ------------------------------------------------------------------------------------------
# One entry per series the site publishes. To add a series: copy an entry, change the fields,
# run `python -m pipeline.run --only <ID>` and check data/catalog.json. No code changes needed.
#
# Fields
#   id        Site-wide identifier (UPPER_SNAKE). Used in URLs and file names.
#   name      Display name.
#   group     Terminal module grouping (see site/assets/js/modules/*).
#   provider  fred | nyfed | coinbase | bis   (curves are configured separately below)
#   key       Provider series code. nyfed: "<RATE>:<field>" e.g. "SOFR:p99".
#   units     Display units AFTER `scale` is applied.
#   scale     Multiply provider values (e.g. 0.001 converts USD millions to USD billions).
#   freq      D, W, M, Q (native frequency).
#   change    How changes are expressed: bp (yields/rates), pct (prices/indices), abs (levels).
#   type      Data class shown in the UI. One of:
#               administered | overnight_market | treasury_yield | market_close | official_release
#               | model_estimate | survey | proxy | derived
#   check     Verification evidence (docs/DATA_SOURCES.md):
#               tested     = representative call made on 2026-10-10
#               production = returned data in the existing GitHub Actions pipeline (raw.json, 2026-10-09)
#               family     = same endpoint/series family as a tested call; confirmed at first pipeline run
#   start     Earliest date to request (keeps files small).
#   fallback  Optional {provider, key} used if the primary provider fails.
#   owner     Copyright owner for third-party data shown via FRED (displayed with the series).
# ------------------------------------------------------------------------------------------

